; PlatformIO Configuration — ESP32-CAM Vision Node (AI-Thinker module)
; Board: AI-Thinker ESP32-CAM
; Framework: Arduino
;
; Libraries:
;   - NimBLE-Arduino          (BLE client: listens for trigger, sends results)
;   - Edge Impulse SDK        (FOMO inference — replace with your EI library after export)

[env:esp32_cam_node]
platform  = espressif32
board     = esp32cam
framework = arduino

monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM          ; AI-Thinker has 4MB PSRAM — needed for camera frame buffer
    -mfix-esp32-psram-cache-issue

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    ; After Edge Impulse export, add:
    ; file://path/to/ei-indoor-nav-arduino-x.x.x.zip

src_filter = +<src/>
