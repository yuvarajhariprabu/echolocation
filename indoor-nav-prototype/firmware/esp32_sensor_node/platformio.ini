; PlatformIO Configuration — ESP32 Sensor Node (ESP32 DevKit WROOM)
; Board: ESP32 WROOM-32 / DevKit V1
; Framework: Arduino
;
; Libraries:
;   - Adafruit VL53L0X        (ToF drop-off sensor)
;   - Adafruit MPU6050        (IMU)
;   - Adafruit BusIO          (dependency)
;   - NimBLE-Arduino          (BLE server, leaner than bluedroid)
;   - TensorFlowLite_ESP32    (TFLite Micro — only active when USE_TINYML=1)

[env:esp32_sensor_node]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSE_TINYML=0          ; set to 1 after model_data.h is generated

lib_deps =
    adafruit/Adafruit VL53L0X @ ^1.2.4
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit BusIO  @ ^1.16.1
    h2zero/NimBLE-Arduino    @ ^1.4.3
    ; Uncomment when USE_TINYML=1:
    ; tensorflow/TensorFlowLite_ESP32 @ ^0.9.0

; Increase stack size for FreeRTOS tasks
board_build.partitions = default.csv

; Source filter — include all subdirs under src/
src_filter = +<src/>
